version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    copyloopvar:
      check-alias: true
    dupl:
      threshold: 400
    goconst:
      # goconst v1.8+ also checks strings in composite literals (test fixtures,
      # unstructured field paths, ...). Keep the previous behavior.
      exclude-types:
        - Call
        - CompositeLit
    gocyclo:
      min-complexity: 30
    lll:
      line-length: 170
    staticcheck:
      checks:
        # golangci-lint defaults.
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Explicit embedded field selectors are often clearer.
        - -QF1008
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: Using the variable on range scope `tc` in function literal
      - path: (.+)\.go$
        text: 'unused-parameter: parameter'
      # Test fixtures contain Secret manifests.
      - path: _test\.go$
        linters:
          - gosec
        text: G101
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
